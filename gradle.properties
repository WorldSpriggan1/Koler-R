# ==============================================================================
# Project-wide Gradle settings for Android build configuration
# ==============================================================================
# NOTE: IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override* any settings 
# specified in this file.
#
# For more details on how to configure your build environment:
# http://www.gradle.org/docs/current/userguide/build_environment.html

# ==============================================================================
# ANDROID BUILD CONFIGURATION
# ==============================================================================

# Enable Jetifier to support legacy support libraries
android.enableJetifier=true

# Use AndroidX instead of legacy support library
android.useAndroidX=true

# ==============================================================================
# JVM SETTINGS - Gradle Daemon Process
# ==============================================================================
# Set JVM memory for Gradle daemon process
# Xmx: Maximum heap size (current: 1536MB)
# Increase if you encounter OutOfMemoryError during builds
# Recommended: 2048m for larger projects, 4096m for very large projects
org.gradle.jvmargs=-Xmx1536m

# ==============================================================================
# KOTLIN BUILD SETTINGS
# ==============================================================================
# Use official Kotlin code style (IDEA/IntelliJ standard)
kotlin.code.style=official

# ==============================================================================
# GRADLE DAEMON OPTIMIZATION
# ==============================================================================
# Enable parallel build execution for multi-module projects
# WARNING: Only enable for decoupled projects (no inter-module dependencies)
# Uncommenting this can significantly speed up builds:
# org.gradle.parallel=true

# Enable configuration cache (incubating/experimental feature)
# Speeds up subsequent builds by caching task configuration
# May cause issues with plugins that don't support it yet
org.gradle.unsafe.configuration-cache=true

# ==============================================================================
# OPTIONAL PERFORMANCE TUNING
# ==============================================================================
# Uncomment the following for additional optimization:

# Enable build cache (requires Gradle 3.5+)
# org.gradle.caching=true

# Run Gradle daemon as a separate process (default: true)
# org.gradle.daemon=true

# Minimum number of worker processes
# org.gradle.workers.max=<number of processors>

# Enable verbose logging for debugging (disable after troubleshooting)
# org.gradle.logging.level=debug
